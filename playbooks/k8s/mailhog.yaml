apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  namespace: devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailhog
  template:
    metadata:
      labels:
        app: mailhog
    spec:
      containers:
        - name: mailhog
          image: mailhog/mailhog
          ports:
            - containerPort: 8025
---
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  namespace: devops
spec:
  selector:
    app: mailhog
  ports:
    - port: 8025